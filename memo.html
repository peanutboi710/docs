<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <title>MEMO, 메모</title>
    <link rel="stylesheet" href="style.css">



    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />


<meta property="og:title" content="Memo makes you better" />
    <meta property="og:description" content="당신의 메모로 한편의 타이포그래피를 경험하세요" />
    <meta property="og:url" content="https://peanutboi710.github.io/docs" />
    <!-- <meta property="og:url" content="{본인 깃허브 페이지}" /> -->
    <meta
      property="og:image"
      content="https://peanutbou710.github.io/docs/og_preview.png"
    />

  </head>
  <body>
    <section id="page" class="center">
      <section id="container" class="center">
        
        <div id="topSection">
          <a href="index.html" class="main-link">
            <h1>Memo makes you better</h1>
          </a>
          
          <form id="memoWriter" class="center">
            <textarea name="memo" required placeholder="여기에 메모를 작성해 시작"></textarea>
            <div class="btn-group">
              <button type="submit">작성</button>
              <button id="resetBtn" type="button">전체리셋</button>
            </div>
          </form>
        </div>

        <div id="scrollArea">
          <section id="singleMemoContainer"></section>
          <div id="historyMemoContainer" style="width: 100%;"></div>
        </div>

      </section>
    </section>

    <script>
      document.addEventListener("DOMContentLoaded", main);

      const memoWriter = document.querySelector("#memoWriter");
      const singleMemoContainer = document.querySelector("#singleMemoContainer");
      const historyMemoContainer = document.querySelector("#historyMemoContainer");
      const resetBtn = document.querySelector("#resetBtn");

      let fontTimerId = null;

      function main() {
        console.log("최신 메모 삭제 및 자동 승격 시스템 작동 시작");
        
        memoWriter.addEventListener("submit", memoWriterHandler);
        
        resetBtn.addEventListener("click", () => {
          if (confirm("모든 메모를 삭제하시겠습니까?")) {
            localStorage.removeItem("memos");
            drawMemo(); 
          }
        });

        drawMemo();
      }

      function memoWriterHandler(event) {
        event.preventDefault();
        
        const formData = new FormData(event.target);
        const memoText = formData.get("memo").trim();
        
        if (!memoText) return;

        const storedMemos = localStorage.getItem("memos");
        const memoList = storedMemos ? JSON.parse(storedMemos) : [];
        
        const newMemoObj = {
          id: Date.now(),
          text: memoText
        };

        memoList.unshift(newMemoObj);
        localStorage.setItem("memos", JSON.stringify(memoList));
        
        drawMemo(); 
        event.target.reset();
      }

      function drawMemo() {
        if (fontTimerId !== null) {
          clearInterval(fontTimerId);
          fontTimerId = null;
        }

        singleMemoContainer.innerHTML = "";
        historyMemoContainer.innerHTML = "";
        
        const storedMemos = localStorage.getItem("memos");
        const memoList = storedMemos ? JSON.parse(storedMemos) : [];

        if (memoList.length === 0) {
          const emptyMsg = document.createElement("p");
          emptyMsg.classList.add("empty-message");
          emptyMsg.textContent = "작성된 메모가 없습니다. 새로운 메모를 등록해 주세요.";
          singleMemoContainer.append(emptyMsg);
          return;
        }

        const fonts = [
          "'Nanum Pen Script', cursive",
          "'Courier New', Courier, monospace",
          "'Comic Sans MS', cursive, sans-serif",
          "Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif",
          "'Times New Roman', Times, serif"
        ];

        memoList.forEach((memoObj, index) => {
          const { id, text } = memoObj;
          
          const textElement = document.createElement("div");
          textElement.classList.add("memo-text");
          textElement.textContent = text;

          const btnGroup = document.createElement("div");
          btnGroup.classList.add("memo-btns");

          const cpBtn = document.createElement("button");
          cpBtn.textContent = "복사하기";
          cpBtn.addEventListener("click", () => {
            if (confirm("이 메모를 복사하시겠습니까?")) {
              navigator.clipboard.writeText(text);
              alert("복사가 완료되었습니다.");
            }
          });
          btnGroup.append(cpBtn);

          const delBtn = document.createElement("button");
          delBtn.textContent = "삭제";
          delBtn.style.backgroundColor = "#ff9999"; 
          
          delBtn.addEventListener("click", () => {
            if (confirm("이 메모를 삭제하시겠습니까?")) {
              const updatedList = memoList.filter(item => item.id !== id);
              localStorage.setItem("memos", JSON.stringify(updatedList));
              drawMemo(); 
            }
          });

          if (index === 0) {
            const stopBtn = document.createElement("button");
            stopBtn.textContent = "폰트 멈춤"; 
            
            let fontIndex = 0;

            function startFontTimer() {
              fontTimerId = setInterval(() => {
                textElement.style.fontFamily = fonts[fontIndex];
                fontIndex = (fontIndex + 1) % fonts.length;
              }, 100);
            }

            stopBtn.addEventListener("click", () => {
              if (fontTimerId !== null) {
                clearInterval(fontTimerId); 
                fontTimerId = null;         
                stopBtn.textContent = "폰트 시작"; 
              } else {
                startFontTimer();           
                stopBtn.textContent = "폰트 멈춤"; 
              }
            });

            btnGroup.append(stopBtn, delBtn);
            singleMemoContainer.append(textElement, btnGroup);
            startFontTimer();
          } 
          else {
            const newBox = document.createElement("div");
            newBox.classList.add("new-memo-box");

            btnGroup.append(delBtn);

            textElement.style.fontFamily = fonts[0];
            newBox.append(textElement, btnGroup);
            historyMemoContainer.append(newBox);
          }
        });
      }
    </script>
  </body>
</html>
